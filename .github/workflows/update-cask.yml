name: Update Cask

on:
  repository_dispatch:
    types: [update-cask]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update cask
        run: |
          CASK="${{ github.event.client_payload.cask }}"
          VERSION="${{ github.event.client_payload.version }}"
          REPO="${{ github.event.client_payload.repo }}"

          echo "Updating cask $CASK to version $VERSION (repo: $REPO)"

          CASK_FILE="Casks/${CASK}.rb"

          if [ ! -f "$CASK_FILE" ]; then
            echo "Error: cask file $CASK_FILE not found"
            exit 1
          fi

          # Pull the checksums generated by the release workflow.
          CHECKSUMS=$(curl -fsSL "https://github.com/${REPO}/releases/download/v${VERSION}/checksums.txt")
          echo "$CHECKSUMS"

          # Fefe's .dmg artifacts are named Fefe-<version>-<arch>.dmg.
          SHA_ARM=$(echo "$CHECKSUMS"   | grep -i "Fefe-${VERSION}-arm64.dmg" | awk '{print $1}')
          SHA_INTEL=$(echo "$CHECKSUMS" | grep -i "Fefe-${VERSION}-x64.dmg"   | awk '{print $1}')

          if [ -z "$SHA_ARM" ] || [ -z "$SHA_INTEL" ]; then
            echo "Error: could not find both .dmg checksums in checksums.txt"
            exit 1
          fi

          echo "Updating from $(grep -m1 'version ' "$CASK_FILE") to $VERSION"

          python3 - "$CASK_FILE" "$VERSION" "$SHA_ARM" "$SHA_INTEL" << 'PYEOF'
          import re
          import sys

          cask_file, version, sha_arm, sha_intel = sys.argv[1:5]

          with open(cask_file) as f:
              content = f.read()

          content = re.sub(r'version "[^"]*"', f'version "{version}"', content, count=1)
          content = re.sub(r'(sha256 arm:\s*")[0-9a-fA-F]{64}(")', rf'\g<1>{sha_arm}\g<2>', content, count=1)
          content = re.sub(r'(intel:\s*")[0-9a-fA-F]{64}(")', rf'\g<1>{sha_intel}\g<2>', content, count=1)

          with open(cask_file, 'w') as f:
              f.write(content)
          PYEOF

          cat "$CASK_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/
          git commit -m "Update ${{ github.event.client_payload.cask }} cask to ${{ github.event.client_payload.version }}"
          git push
